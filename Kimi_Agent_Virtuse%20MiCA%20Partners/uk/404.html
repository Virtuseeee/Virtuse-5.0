<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --btc-orange: #f7931a;
  --btc-orange-light: #ffb84d;
  --dark: #0d1421;
  --dark-lighter: #111a2b;
  --text: #e6edf3;
  --text-muted: #8b949e;
  --border: #30363d;
}

html, body {
  height: 100%;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--dark);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.err-nav {
  padding: 28px 40px;
}

.err-nav a {
  display: inline-flex;
  align-items: flex-end;
  gap: 2px;
  text-decoration: none;
}

.err-main {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 40px 24px;
}

.err-code {
  font-size: clamp(64px, 14vw, 140px);
  font-weight: 900;
  line-height: 1;
  letter-spacing: -0.03em;
  background: linear-gradient(135deg, var(--btc-orange-light), var(--btc-orange));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

.err-title {
  margin-top: 16px;
  font-size: clamp(20px, 3vw, 28px);
  font-weight: 700;
  color: var(--text);
}

.err-desc {
  margin: 14px auto 0;
  max-width: 460px;
  font-size: 16px;
  line-height: 1.6;
  color: var(--text-muted);
}

.err-cta {
  margin-top: 32px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 14px 28px;
  border-radius: 999px;
  background: var(--btc-orange);
  color: #0d1421;
  font-weight: 700;
  font-size: 15px;
  text-decoration: none;
  transition: background 0.2s ease, transform 0.2s ease;
}

.err-cta:hover {
  background: var(--btc-orange-light);
  transform: translateY(-1px);
}

.err-footer {
  padding: 24px;
  text-align: center;
  font-size: 13px;
  color: var(--text-muted);
  border-top: 1px solid var(--border);
}

/* ===== UK: compact nav text =====
   Ukrainian nav labels run noticeably longer than their English originals,
   so at the same per-item padding/font-size they wrap onto two lines well
   before the English nav does. Tighten the gap/padding/font-size a notch
   and force single-line labels so the row matches (or beats) the English
   nav's fit at the same viewport width. */
/* .nav-actions groups the language switcher with the CTA button into one
   flex item so the nav's space-between doesn't spread them apart -- the
   switcher sits right next to the CTA, not centered in the leftover gap.
   Declared before the media queries below so their narrower-width
   overrides (same selector) win the cascade at those widths. */
.nav-actions { display: flex; align-items: center; gap: 12px; }

.lang-menu { position: relative; }

@media (min-width: 1025px) {
  .nav-links { gap: 2px; }
  .nav-links a {
    font-size: 13px;
    padding: 8px 9px;
    white-space: nowrap;
  }
}

/* Extra squeeze for the narrow "almost mobile" desktop band, where even
   the compact pass above isn't quite enough room for the longer labels. */
@media (min-width: 1025px) and (max-width: 1240px) {
  .nav { padding: 20px 16px; }
  .nav-links { gap: 0; }
  .nav-links a { padding: 7px 4px; font-size: 12px; }
  .nav-actions { gap: 8px; }
  .nav-cta { padding: 10px 12px; }
}

/* ===== UK: compact language dropdown =====
   Site-navigation stays exactly as shipped (inline links >1024px,
   hamburger overlay <=1024px) -- only the language switcher moves out of
   the inline nav row. A single compact button opens a small dropdown
   (EN/SK/UA), so the desktop nav row never overflows regardless of how
   many languages exist. */

.lang-menu-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: var(--dark-card);
  border: 1px solid var(--border);
  border-radius: 100px;
  padding: 6px 11px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.02em;
  color: var(--text);
  cursor: pointer;
  transition: border-color 0.2s ease;
}

.lang-menu-btn:hover { border-color: var(--btc-orange); }

.lang-menu-caret {
  opacity: 0.6;
  transition: transform 0.2s ease;
}

.lang-menu.open .lang-menu-caret { transform: rotate(180deg); }

.lang-menu-panel {
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 130px;
  background: var(--dark-card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 6px;
  opacity: 0;
  visibility: hidden;
  transform: translateY(-6px);
  transition: opacity 0.18s ease, transform 0.18s ease, visibility 0.18s;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
  z-index: 200;
}

.lang-menu.open .lang-menu-panel {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
}

.lang-menu-panel .lang-opt {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 12px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 700;
  color: var(--text-muted);
  text-decoration: none;
  transition: background 0.15s ease, color 0.15s ease;
}

.lang-menu-panel .lang-opt:hover { background: rgba(255, 255, 255, 0.06); color: var(--text); }

.lang-menu-panel .lang-opt.active {
  background: var(--btc-orange);
  color: #0d0902;
}

@media (max-width: 1024px) {
  .lang-menu { display: none; }
}
</style>
