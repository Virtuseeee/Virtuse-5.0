<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&family=JetBrains+Mono:wght@500&display=block">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;background:#08090a;overflow:hidden}
body{position:relative;font-family:Inter,sans-serif;color:#e6edf3}
.glow{position:absolute;left:640px;top:-120px;width:720px;height:720px;border-radius:50%;background:radial-gradient(circle,rgba(247,147,26,.20) 0%,rgba(247,147,26,.07) 38%,rgba(247,147,26,0) 68%)}
.logo{position:absolute;left:84px;top:72px;display:flex;align-items:center;gap:16px;font-weight:700;font-size:29px;letter-spacing:-.01em}
.logo svg{height:34px;width:auto}
.eye{position:absolute;left:78px;top:178px;display:flex;align-items:center;gap:10px;font:500 17px "JetBrains Mono",monospace;letter-spacing:.2em;color:#8b949e;text-transform:uppercase}
.eye i{width:22px;height:22px;border-radius:50%;background:rgba(247,147,26,.18);display:grid;place-items:center}
.eye i::after{content:"";width:10px;height:10px;border-radius:50%;background:#f7931a}
h1{position:absolute;left:84px;top:220px;width:820px;font-size:66px;line-height:1.1;font-weight:700;letter-spacing:-.025em}
h1 em{font-style:normal;color:#f7931a}
.sub{position:absolute;left:84px;top:522px;display:flex;gap:14px}
.sub span{border:1px solid rgba(255,255,255,.12);background:#141414;border-radius:999px;padding:12px 22px;font-size:20px;color:#e6edf3}
.ring{position:absolute;left:893px;top:351px;width:222px;height:222px;border-radius:50%;background:#141414;border:1px solid rgba(255,255,255,.12);display:grid;place-items:center;align-content:center;gap:12px;text-align:center}
.ring b{font-size:52px;font-weight:700;letter-spacing:-.02em;line-height:1}
.ring b small{color:#f7931a;font-size:52px}
.ring span{font:500 15px "JetBrains Mono",monospace;letter-spacing:.14em;color:#8b949e;text-transform:uppercase}
</style></head><body>
<div class="glow"></div>
<div class="logo"><svg viewBox="0 0 760 483" aria-hidden="true"><defs><linearGradient id="vA" x1="0" y1="0" x2="0.55" y2="1"><stop offset="0" stop-color="#A5E0FB"/><stop offset="1" stop-color="#5FAEDE"/></linearGradient><linearGradient id="vB" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#4D94EC"/><stop offset="1" stop-color="#2B62C0"/></linearGradient></defs><path fill="url(#vA)" d="M30 0h220l250 483H280Z"/><path fill="url(#vB)" d="M510 0h245L645 205H400Z"/></svg><span>Virtuse</span></div>
<div class="eye"><i></i>Porovnanie partnerov</div>
<h1>Kúpiť Bitcoin <em>v Európe</em></h1>
<div class="sub"><span>Poplatky partnerov</span><span>Návod v 4 krokoch</span></div>
<div class="ring"><b><small>&#8383;</small> EUR</b><span>SEPA · KYC</span></div>
</body></html>
