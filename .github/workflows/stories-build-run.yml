name: Stories build (one attempt)

# Called by stories-build.yml up to three times, each time on a fresh runner
# (= a different GitHub IP). Webglobe drops TCP connections from part of
# GitHub's IP ranges, so a run either reaches blog.virtuse.com at all or not
# at all; retrying from the same runner doesn't help.
#
# Starts with a connection check. Unreachable -> the job ends green with
# reachable=false and skips everything else, so the caller tries the next
# runner. Reachable -> build, commit and staging publish run exactly as they
# did before; a failure there fails the job (no further attempts).

on:
  workflow_call:
    inputs:
      attempt:
        type: number
        required: true
    outputs:
      reachable:
        description: "'true' if blog.virtuse.com accepted a connection from this runner"
        value: ${{ jobs.build.outputs.reachable }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      reachable: ${{ steps.probe.outputs.reachable }}
    env:
      SITE: Kimi_Agent_Virtuse%20MiCA%20Partners
    steps:
      - name: Check connection to blog.virtuse.com
        id: probe
        run: |
          ip=$(curl -s --max-time 10 https://api.ipify.org || echo unknown)
          if curl --connect-timeout 10 --max-time 60 -sS -o /dev/null -I https://blog.virtuse.com/wp-json/; then
            echo "reachable=true" >> "$GITHUB_OUTPUT"
            echo "Attempt ${{ inputs.attempt }}: blog.virtuse.com reachable from runner $ip, building." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Stories build::Attempt ${{ inputs.attempt }}: blog.virtuse.com unreachable from runner $ip, trying the next runner"
            echo "Attempt ${{ inputs.attempt }}: blog.virtuse.com **unreachable** from runner $ip, skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout main
        if: steps.probe.outputs.reachable == 'true'
        uses: actions/checkout@v5
        with:
          ref: main
          path: main

      - name: Set up Node
        if: steps.probe.outputs.reachable == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build story pages from WordPress
        if: steps.probe.outputs.reachable == 'true'
        working-directory: main
        run: node stories-build/build.mjs

      - name: Detect changes
        id: diff
        if: steps.probe.outputs.reachable == 'true'
        working-directory: main
        run: |
          git add -A "$SITE/stories" "$SITE/sk/stories" "$SITE/ru/stories" "$SITE/sitemap.xml" stories-build/manifest.json stories-build/upload.sftp
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No story changes." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Story pages changed"
              echo
              echo '```'
              git diff --cached --name-status -- "$SITE" | sed "s|$SITE/||; s|/index.html||" | sort | head -200
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit to main
        if: steps.diff.outputs.changed == 'true'
        working-directory: main
        run: |
          git config user.name "virtuse-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Update pre-rendered story pages from WordPress [skip ci]"
          git pull --rebase origin main
          git push origin main
          echo "MAIN_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Checkout gh-pages
        if: steps.diff.outputs.changed == 'true'
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: pages

      - name: Publish story pages to staging (gh-pages)
        if: steps.diff.outputs.changed == 'true'
        run: |
          # gh-pages holds the site folder at its root. Mirror only the three
          # story trees (removed stories disappear too) and sitemap.xml (its
          # STORIES-BUILD block lists them); nothing else on gh-pages is
          # touched.
          for d in stories sk/stories ru/stories; do
            mkdir -p "pages/$d"
            rsync -a --delete "main/$SITE/$d/" "pages/$d/"
          done
          cp "main/$SITE/sitemap.xml" pages/sitemap.xml
          cd pages
          git config user.name "virtuse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A stories sk/stories ru/stories sitemap.xml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Sync main $MAIN_SHA: pre-rendered story pages"
          git push origin gh-pages
          {
            echo
            echo "Published to staging (gh-pages). **Production is manual:** run the two commands in stories-build/README.md → Upload."
          } >> "$GITHUB_STEP_SUMMARY"
