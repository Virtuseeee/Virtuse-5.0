name: Asset returns

# Rebuilds data/asset-returns.json (the table on asset-returns.html) from
# Yahoo Finance, and data/btc-monthly-returns.json (the heatmap on
# btc-monthly-returns.html) from CoinMetrics, every weekday after the US close, commits it to main and
# copies it to staging (gh-pages). When a month has closed, it also rebuilds the
# /bitcoin-returns/ month and year pages and the summary on btc-monthly-returns.html
# (in between, btc-returns.js updates their numbers in the browser). The page reads the file from GitHub
# (raw.githubusercontent.com), so production shows fresh numbers without an
# upload; the page's own copy on the server is only the fallback.

on:
  schedule:
    - cron: '30 22 * * 1-5' # 22:30 UTC Mon–Fri, after the US close
    - cron: '0 12 * * 0,6'  # weekends: Bitcoin trades every day
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'asset-returns-build/build.mjs'
      - 'btc-monthly-build/build.mjs'
      - '.github/workflows/asset-returns.yml'

permissions:
  contents: write

concurrency:
  group: asset-returns
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE: Kimi_Agent_Virtuse%20MiCA%20Partners
      FILES: data/asset-returns.json data/btc-monthly-returns.json
      # written by i18n-tools/btc-returns/build_returns.py; PUBLISH = the part that goes to gh-pages
      PAGES: bitcoin-returns btc-monthly-returns.html sitemap.xml i18n-tools/legacy/src/en/btc-monthly-returns.html i18n-tools/btc-returns/state.json
      PUBLISH: bitcoin-returns btc-monthly-returns.html sitemap.xml
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build asset returns
        working-directory: main
        run: node asset-returns-build/build.mjs

      # BTC monthly heatmap data (btc-monthly-returns.html). Separate source
      # (CoinMetrics); a failure here must not block the asset returns update.
      - name: Build BTC monthly returns
        working-directory: main
        continue-on-error: true
        run: node btc-monthly-build/build.mjs

      # Month and year pages: only when a month has closed since the last build.
      - name: Build Bitcoin returns pages
        working-directory: main
        continue-on-error: true
        run: python3 "$SITE/i18n-tools/btc-returns/build_returns.py" --monthly

      - name: Commit to main
        id: commit
        working-directory: main
        run: |
          for f in $FILES $PAGES; do git add "$SITE/$f"; done
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git config user.name "virtuse-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Update asset returns data [skip ci]"
          git pull --rebase origin main
          git push origin main

      - uses: actions/checkout@v4
        if: steps.commit.outputs.changed == 'true'
        with:
          ref: gh-pages
          path: pages

      - name: Publish to staging (gh-pages)
        if: steps.commit.outputs.changed == 'true'
        run: |
          mkdir -p pages/data
          for f in $FILES; do cp "main/$SITE/$f" "pages/$f"; done
          for f in $PUBLISH; do cp -R "main/$SITE/$f" "pages/"; done
          cd pages
          git config user.name "virtuse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add $FILES $PUBLISH
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update asset returns data"
          git push origin gh-pages
