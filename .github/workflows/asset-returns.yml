name: Asset returns

# Rebuilds data/asset-returns.json (the table on asset-returns.html) from
# Yahoo Finance every weekday after the US close, commits it to main and
# copies it to staging (gh-pages). The page reads the file from GitHub
# (raw.githubusercontent.com), so production shows fresh numbers without an
# upload; the page's own copy on the server is only the fallback.

on:
  schedule:
    - cron: '30 22 * * 1-5' # 22:30 UTC Mon–Fri, after the US close
    - cron: '0 12 * * 0,6'  # weekends: Bitcoin trades every day
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'asset-returns-build/build.mjs'
      - '.github/workflows/asset-returns.yml'

permissions:
  contents: write

concurrency:
  group: asset-returns
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE: Kimi_Agent_Virtuse%20MiCA%20Partners
      FILE: data/asset-returns.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build asset returns
        working-directory: main
        run: node asset-returns-build/build.mjs

      - name: Commit to main
        id: commit
        working-directory: main
        run: |
          git add "$SITE/$FILE"
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git config user.name "virtuse-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Update asset returns data [skip ci]"
          git pull --rebase origin main
          git push origin main

      - uses: actions/checkout@v4
        if: steps.commit.outputs.changed == 'true'
        with:
          ref: gh-pages
          path: pages

      - name: Publish to staging (gh-pages)
        if: steps.commit.outputs.changed == 'true'
        run: |
          mkdir -p pages/data
          cp "main/$SITE/$FILE" "pages/$FILE"
          cd pages
          git config user.name "virtuse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$FILE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update asset returns data"
          git push origin gh-pages
