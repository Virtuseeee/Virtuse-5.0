name: Virtuse News

# Fetches the Bitcoin Pulse stats (price, dominance, 200W MA, 100-day EMA),
# renders email/virtuse-news-template.html with them plus this issue's
# hand-written date/subject from email/virtuse-news-issue.json, and creates
# a draft broadcast in Resend with the HTML sent directly in the request.
#
# Draft-only by default: a human still reviews and clicks send in Resend
# (and, more importantly, still hand-writes this issue's headline, article
# paragraphs, chart captions, and meme directly in
# email/virtuse-news-template.html before this workflow runs -- only the 4
# stat-tile numbers and the issue-date line are auto-filled). To also
# auto-send, re-run manually with "send" = true, or flip the default in the
# workflow_dispatch input below once you trust the pipeline.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   RESEND_API_KEY, RESEND_SEGMENT_ID, RESEND_FROM_EMAIL
# See email/README.md for how to obtain these.

on:
  schedule:
    - cron: '0 7 * * 2' # Tuesday 07:00 UTC -- adjust to land before your actual send time
  workflow_dispatch:
    inputs:
      send:
        description: 'Also trigger the Resend send (default: draft only)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  virtuse-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch stats and render email
        run: node .github/scripts/render-virtuse-news.mjs

      - name: Commit updated pulse cache back to main
        run: |
          git config user.name "virtuse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add email/pulse-cache.json
          git diff --cached --quiet || git commit -m "Update Bitcoin Pulse cache [skip ci]"
          git push origin main

      - name: Create Resend draft broadcast
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_SEGMENT_ID: ${{ secrets.RESEND_SEGMENT_ID }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          SEND_NOW: ${{ github.event.inputs.send }}
        run: node .github/scripts/create-virtuse-news-broadcast.mjs
