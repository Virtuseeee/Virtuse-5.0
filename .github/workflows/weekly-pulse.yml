name: Weekly Virtuse Report

# Fetches the Bitcoin Pulse stats, renders email/template.html with them plus
# this week's human-written content from email/weekly-issue.json, publishes
# the result to a noindexed path on gh-pages (Zoho's createCampaign API only
# accepts a public content_url, not raw HTML -- see the create-zoho-draft.mjs
# script for why), and creates a draft campaign in Zoho Campaigns.
#
# Draft-only by default: a human still reviews and clicks send in Zoho. To
# also auto-send, re-run manually with "send" = true, or flip the default in
# the workflow_dispatch input below once you trust the pipeline.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   ZOHO_CLIENT_ID, ZOHO_CLIENT_SECRET, ZOHO_REFRESH_TOKEN
#   ZOHO_LIST_KEY, ZOHO_FROM_EMAIL
# See email/README.md for how to obtain these.

on:
  schedule:
    - cron: '0 7 * * 2' # Tuesday 07:00 UTC -- adjust to land before your actual send time
  workflow_dispatch:
    inputs:
      send:
        description: 'Also trigger the Zoho send (default: draft only)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  weekly-pulse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch stats and render email
        run: node .github/scripts/render-pulse.mjs

      - name: Commit updated pulse cache back to main
        run: |
          git config user.name "virtuse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add email/pulse-cache.json
          git diff --cached --quiet || git commit -m "Update Bitcoin Pulse cache [skip ci]"
          git push origin main

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: ghpages

      - name: Publish rendered email to gh-pages
        id: publish
        run: |
          ISSUE_DATE=$(node -pe "JSON.parse(require('fs').readFileSync('email/weekly-issue.json','utf8')).issue_date.replace(/\s+/g,'-')")
          mkdir -p ghpages/email-archive
          cp dist/weekly-email.html "ghpages/email-archive/${ISSUE_DATE}.html"
          cd ghpages
          git config user.name "virtuse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "email-archive/${ISSUE_DATE}.html"
          git diff --cached --quiet || git commit -m "Publish weekly report for Zoho content_url fetch (${ISSUE_DATE})"
          git push origin gh-pages
          echo "url=https://staging.virtuse.com/email-archive/${ISSUE_DATE}.html" >> "$GITHUB_OUTPUT"

      - name: Create Zoho draft campaign
        env:
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
          ZOHO_LIST_KEY: ${{ secrets.ZOHO_LIST_KEY }}
          ZOHO_FROM_EMAIL: ${{ secrets.ZOHO_FROM_EMAIL }}
          SEND_NOW: ${{ github.event.inputs.send }}
        run: node .github/scripts/create-zoho-draft.mjs "${{ steps.publish.outputs.url }}"
