name: Weekly Virtuse Report

# Fetches the Bitcoin Pulse stats, renders email/template.html with them plus
# this week's human-written content from email/weekly-issue.json, and
# creates a draft broadcast in Resend with the HTML sent directly in the
# request (no publish-to-a-public-URL step needed, unlike the old
# Zoho-based version of this workflow).
#
# Draft-only by default: a human still reviews and clicks send in Resend. To
# also auto-send, re-run manually with "send" = true, or flip the default in
# the workflow_dispatch input below once you trust the pipeline.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   RESEND_API_KEY, RESEND_SEGMENT_ID, RESEND_FROM_EMAIL
# See email/README.md for how to obtain these.

on:
  schedule:
    - cron: '0 7 * * 2' # Tuesday 07:00 UTC -- adjust to land before your actual send time
  workflow_dispatch:
    inputs:
      send:
        description: 'Also trigger the Resend send (default: draft only)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  weekly-pulse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch stats and render email
        run: node .github/scripts/render-pulse.mjs

      - name: Commit updated pulse cache back to main
        run: |
          git config user.name "virtuse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add email/pulse-cache.json
          git diff --cached --quiet || git commit -m "Update Bitcoin Pulse cache [skip ci]"
          git push origin main

      - name: Create Resend draft broadcast
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_SEGMENT_ID: ${{ secrets.RESEND_SEGMENT_ID }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          SEND_NOW: ${{ github.event.inputs.send }}
        run: node .github/scripts/create-resend-broadcast.mjs
