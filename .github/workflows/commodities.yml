name: Bitcoin vs commodities

# Rebuilds data/bitcoin-vs-commodities.json (the tables and charts on
# bitcoin-vs-gold.html) from Yahoo Finance every day after the US close,
# commits it to main and copies it to staging (gh-pages). The page reads the
# file from GitHub (raw.githubusercontent.com) first, so production shows fresh
# numbers without an upload; the copy on the server is only the fallback.
# The build writes the file only after its checks pass; a failure leaves the
# last good file in place and this run fails with an ::error annotation.

on:
  schedule:
    - cron: '30 23 * * *'   # 23:30 UTC daily (Bitcoin trades every day)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'commodities-build/build.mjs'
      - '.github/workflows/commodities.yml'

permissions:
  contents: write

concurrency:
  group: commodities
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE: Kimi_Agent_Virtuse%20MiCA%20Partners
      FILE: data/bitcoin-vs-commodities.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Bitcoin vs commodities
        working-directory: main
        run: node commodities-build/build.mjs

      - name: Commit to main
        id: commit
        working-directory: main
        run: |
          git add "$SITE/$FILE"
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git config user.name "virtuse-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Update Bitcoin vs commodities data [skip ci]"
          git pull --rebase origin main
          git push origin main

      - uses: actions/checkout@v4
        if: steps.commit.outputs.changed == 'true'
        with:
          ref: gh-pages
          path: pages

      - name: Publish to staging (gh-pages)
        if: steps.commit.outputs.changed == 'true'
        run: |
          mkdir -p pages/data
          cp "main/$SITE/$FILE" "pages/$FILE"
          cd pages
          git config user.name "virtuse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$FILE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Bitcoin vs commodities data"
          git push origin gh-pages
