name: Stories build

# Regenerates the pre-rendered story pages (stories/, sk/stories/,
# ru/stories/) from WordPress so every new or edited blog story gets its own
# social preview card, then publishes them to staging (gh-pages).
#
# Commits only when something changed: new stories, edited titles/excerpts/
# images, or stories removed from WordPress (their folders are deleted).
#
# Up to three attempts, each on a fresh runner (see stories-build-run.yml):
# Webglobe drops connections from part of GitHub's IPs, so attempt 2 runs only
# if attempt 1 could not reach blog.virtuse.com, attempt 3 only if 2 could not.
# The workflow fails only if all three are unreachable or the build itself
# fails; commit and staging publish happen at most once.
#
# Production (virtuse.com, Webglobe SFTP) stays manual: after a run that
# changed something, run the two commands from stories-build/README.md
# ("Upload"). The job summary lists what changed.

on:
  schedule:
    - cron: '0 5 * * *' # daily 05:00 UTC
  workflow_dispatch:
  # Rebuild when the generator or the page template/desk logic changes.
  # The bot's own commits can't loop: they carry [skip ci] and pushes made
  # with GITHUB_TOKEN don't start workflows.
  push:
    branches: [main]
    paths:
      - 'stories-build/build.mjs'
      - '.github/workflows/stories-build.yml'
      - '.github/workflows/stories-build-run.yml'
      - 'Kimi_Agent_Virtuse%20MiCA%20Partners/article.html'
      - 'Kimi_Agent_Virtuse%20MiCA%20Partners/brief-chrome.js'
      - 'Kimi_Agent_Virtuse%20MiCA%20Partners/sitemap.xml'

permissions:
  contents: write

concurrency:
  group: stories-build
  cancel-in-progress: false

jobs:
  attempt-1:
    uses: ./.github/workflows/stories-build-run.yml
    with:
      attempt: 1

  attempt-2:
    needs: attempt-1
    if: needs.attempt-1.outputs.reachable == 'false'
    uses: ./.github/workflows/stories-build-run.yml
    with:
      attempt: 2

  attempt-3:
    needs: attempt-2
    if: needs.attempt-2.outputs.reachable == 'false'
    uses: ./.github/workflows/stories-build-run.yml
    with:
      attempt: 3

  unreachable:
    needs: attempt-3
    if: needs.attempt-3.outputs.reachable == 'false'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error title=Stories build::blog.virtuse.com unreachable from 3 runners"
          exit 1
