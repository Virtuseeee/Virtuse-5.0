name: Stories build

# Regenerates the pre-rendered story pages (stories/, sk/stories/,
# ru/stories/) from WordPress so every new or edited blog story gets its own
# social preview card, then publishes them to staging (gh-pages).
#
# Commits only when something changed: new stories, edited titles/excerpts/
# images, or stories removed from WordPress (their folders are deleted).
#
# Production (virtuse.com, Webglobe SFTP) stays manual: after a run that
# changed something, run the two commands from stories-build/README.md
# ("Upload"). The job summary lists what changed.

on:
  schedule:
    - cron: '0 5 * * *' # daily 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stories-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE: Kimi_Agent_Virtuse%20MiCA%20Partners
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build story pages from WordPress
        working-directory: main
        run: node stories-build/build.mjs

      - name: Detect changes
        id: diff
        working-directory: main
        run: |
          git add -A "$SITE/stories" "$SITE/sk/stories" "$SITE/ru/stories" stories-build/manifest.json stories-build/upload.sftp
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No story changes." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Story pages changed"
              echo
              echo '```'
              git diff --cached --name-status -- "$SITE" | sed "s|$SITE/||; s|/index.html||" | sort | head -200
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit to main
        if: steps.diff.outputs.changed == 'true'
        working-directory: main
        run: |
          git config user.name "virtuse-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Update pre-rendered story pages from WordPress [skip ci]"
          git pull --rebase origin main
          git push origin main
          echo "MAIN_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Checkout gh-pages
        if: steps.diff.outputs.changed == 'true'
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages

      - name: Publish story pages to staging (gh-pages)
        if: steps.diff.outputs.changed == 'true'
        run: |
          # gh-pages holds the site folder at its root. Mirror only the three
          # story trees (removed stories disappear too); nothing else on
          # gh-pages is touched.
          for d in stories sk/stories ru/stories; do
            mkdir -p "pages/$d"
            rsync -a --delete "main/$SITE/$d/" "pages/$d/"
          done
          cd pages
          git config user.name "virtuse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A stories sk/stories ru/stories
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Sync main $MAIN_SHA: pre-rendered story pages"
          git push origin gh-pages
          {
            echo
            echo "Published to staging (gh-pages). **Production is manual:** run the two commands in stories-build/README.md → Upload."
          } >> "$GITHUB_STEP_SUMMARY"
